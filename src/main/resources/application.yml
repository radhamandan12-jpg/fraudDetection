spring:
  application:
    name: fraud-capstone
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fraud_capstone}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:fraudapp}
    password: ${DB_PASSWORD:fraudapp123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:${CLAUDE_API_KEY:not-configured}}
      base-url: ${ANTHROPIC_BASE_URL:${LLM_BASE_URL:https://api.anthropic.com}}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
          max-tokens: 2048
          temperature: 0.2

capstone:
  # rules | spring-ai | langchain4j  (see CapstoneProperties.ProcessorMode)
  processor-mode: ${PROCESSOR_MODE:rules}
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  retrieval:
    top-k: 4
    similarity-threshold: 0.35
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
  langchain4j:
    api-key: ${ANTHROPIC_API_KEY:${CLAUDE_API_KEY:not-configured}}
    # LangChain4j appends /messages to base-url, so it must include /v1.
    # Override with LC4J_BASE_URL for a verbatim URL.
    base-url: ${LC4J_BASE_URL:${ANTHROPIC_BASE_URL:${LLM_BASE_URL:https://api.anthropic.com}}/v1}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    temperature: 0.2
    max-tokens: 2048
    timeout-seconds: 60

server:
  port: ${PORT:8090}
